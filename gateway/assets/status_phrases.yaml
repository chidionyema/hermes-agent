# User-facing status messages must not claim that work is making progress,
# that a service is healthy, or that an outcome has succeeded without evidence.
# These are waiting states, not operational verdicts. Do not use them as receipts.
status:
  - No verified result yet.
  - Waiting for an outcome to report.
  - The operation has not returned a verified result.
generic:
  - Checking the request.
  - The result is pending.
  - No verified outcome to report yet.
